<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context-aware Message Agent</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{max-width:1100px;margin:0 auto;padding:40px 20px}h1{margin-bottom:8px}p{color:#5f6b7a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #e0e5ee;border-radius:14px;padding:20px;box-shadow:0 8px 24px #1720330b}textarea{width:100%;height:320px;box-sizing:border-box;border:1px solid #ccd4e0;border-radius:10px;padding:12px;font:13px ui-monospace,monospace}button{background:#2957d8;color:white;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;margin:7px 7px 7px 0}.secondary{background:#edf1f8;color:#25324a}.result{white-space:pre-wrap;font:13px ui-monospace,monospace;background:#101827;color:#dbeafe;border-radius:10px;padding:16px;min-height:280px;overflow:auto}.pill{display:inline-block;background:#e8efff;color:#2957d8;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:3px}.check{display:inline-block;background:#e8f8ef;color:#087443;padding:6px 9px;border-radius:8px;font-size:12px;margin:3px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Context-aware Message Agent</h1>
  <p>Paste JSONL records. The agent infers the communication decision, enforces consent, and returns structured output.</p>
  <div class="grid">
    <section class="card"><h2>Test input</h2><input type="file" id="file" accept=".jsonl,.json,text/plain"><br><button class="secondary" id="sample">Load provided sample</button><button class="secondary" id="noconsent">Load no-consent case</button><textarea id="input" spellcheck="false" placeholder="Paste one JSON object per line…"></textarea><br><button id="run">Run agent</button><span id="status" style="margin-left:12px"></span></section>
    <section class="card"><h2>Agent decision <span class="pill">Deterministic mode</span></h2><div id="summary">Run a test case to see the decision.</div><div id="checks"></div><div id="cards"></div><details><summary>View raw JSON</summary><pre class="result" id="output">Your result will appear here.</pre></details></section>
  </div>
  <script>
    const input=document.querySelector('#input'), output=document.querySelector('#output'), summary=document.querySelector('#summary'), checks=document.querySelector('#checks'), cards=document.querySelector('#cards'), status=document.querySelector('#status');
    document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(f)input.value=await f.text()};
    document.querySelector('#sample').onclick=async()=>input.value=await (await fetch('/sample.jsonl')).text();
    document.querySelector('#noconsent').onclick=()=>input.value=JSON.stringify({task_id:'no_consent_demo',channel_preferences:['sms','email'],consent:{sms_opt_in:false,email_opt_in:false},input:{last_interaction:'2026-09-01T10:00:00Z',timezone:'UTC'}});
    document.querySelector('#run').onclick=async()=>{status.textContent='Running…';try{const r=await fetch('/api/run',{method:'POST',headers:{'content-type':'text/plain'},body:input.value});const data=await r.json();if(!r.ok)throw Error(data.error);output.textContent=JSON.stringify(data,null,2);summary.innerHTML=`<span class="pill">${data.length} case${data.length===1?'':'s'}</span>`;checks.innerHTML='<span class="check">✓ Parsed</span><span class="check">✓ Consent gate</span><span class="check">✓ Structured output</span>';cards.innerHTML=data.map((item,i)=>{const m=item.next_message;return `<div style="border:1px solid #e0e5ee;border-radius:10px;padding:14px;margin:12px 0"><b>${item.task_id??`Case ${i+1}`}</b>${m?`<p><span class="pill">COMMUNICATE: YES</span><span class="pill">${m.channel.toUpperCase()}</span><span class="pill">${m.send_at}</span></p><p><b>CTA:</b> ${m.cta?.type??'none'}<br><b>Next action:</b> ${item.next_action?.type??'none'}</p><div style="background:#f7f9fc;border-left:4px solid #2957d8;padding:12px;white-space:pre-wrap">${m.subject?`Subject: ${m.subject}\n\n`:''}${m.body??''}</div><p style="color:#6a7484;font-size:13px">Reason: ${item.decision_metadata?.reason??'policy decision'}</p>`:`<p><span class="pill">COMMUNICATE: NO</span></p><p style="color:#6a7484">${item.next_action?.reason??'No consented channel is available.'}</p>`}</div>`}).join('');status.textContent='Done';}catch(e){output.textContent=e.message;status.textContent='Error'}};
  </script>
</body>
</html>
